services:
  # The pipeline chunks text, so 32K preserves KV capacity for throughput.
  vllm-text:
    image: ${VLLM_TEXT_IMAGE:-vllm/vllm-openai:v0.17.0}
    container_name: vllm-text
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    ipc: host
    ports: ["8000:8000"]
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_TEXT_MODEL:-Qwen/Qwen3.8-27B}
      - --served-model-name
      - ${VLLM_TEXT_MODEL:-Qwen/Qwen3.8-27B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-local-dev-key}
      - --gpu-memory-utilization
      - ${VLLM_TEXT_GPU_MEMORY_UTILIZATION:-0.72}
      - --max-model-len
      - ${VLLM_TEXT_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${VLLM_TEXT_MAX_NUM_SEQS:-8}
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --language-model-only
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --trust-remote-code

  # Unlimited-OCR requires this dedicated image and logits processor.
  vllm-ocr:
    image: ${VLLM_OCR_IMAGE:-vllm/vllm-openai:unlimited-ocr}
    container_name: vllm-ocr
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    ipc: host
    ports: ["8001:8001"]
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_OCR_MODEL:-baidu/Unlimited-OCR}
      - --served-model-name
      - ${VLLM_OCR_MODEL:-baidu/Unlimited-OCR}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --api-key
      - ${VLLM_API_KEY:-local-dev-key}
      - --gpu-memory-utilization
      - ${VLLM_OCR_GPU_MEMORY_UTILIZATION:-0.15}
      - --max-model-len
      - ${VLLM_OCR_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${VLLM_OCR_MAX_NUM_SEQS:-2}
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --trust-remote-code

  # Opt-in: these should not share an 80 GB H100 with both BF16 models.
  tei-embedding:
    profiles: ["retrieval"]
    image: ghcr.io/huggingface/text-embeddings-inference:hopper-1.9
    container_name: tei-embedding
    restart: unless-stopped
    runtime: nvidia
    shm_size: 1g
    ports: ["8081:80"]
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/data
    command: ["--model-id", "${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}", "--hostname", "0.0.0.0", "--port", "80", "--max-batch-tokens", "${EMBEDDING_MAX_BATCH_TOKENS:-8192}", "--auto-truncate"]

  tei-reranker:
    profiles: ["retrieval"]
    image: ghcr.io/huggingface/text-embeddings-inference:hopper-1.9
    container_name: tei-reranker
    restart: unless-stopped
    runtime: nvidia
    shm_size: 1g
    ports: ["8082:80"]
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/data
    command: ["--model-id", "${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}", "--hostname", "0.0.0.0", "--port", "80", "--max-batch-tokens", "${RERANKER_MAX_BATCH_TOKENS:-4096}", "--auto-truncate"]
