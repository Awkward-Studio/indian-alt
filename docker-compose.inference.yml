services:
  # H100 profile: one multimodal model handles text and images.
  vllm-text:
    image: vllm/vllm-openai:latest
    container_name: vllm-text
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${VLLM_TEXT_MODEL:-google/gemma-4-12b-it}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-local-dev-key}
      - --gpu-memory-utilization
      - ${VLLM_TEXT_GPU_MEMORY_UTILIZATION:-0.77}
      - --max-model-len
      - ${VLLM_TEXT_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${VLLM_TEXT_MAX_NUM_SEQS:-16}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --trust-remote-code

  # 3. TEI Embedding
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:hopper-1.9
    container_name: tei-embedding
    restart: unless-stopped
    runtime: nvidia
    shm_size: 1g
    ports:
      - "8081:80"
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/data
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --max-batch-tokens
      - ${EMBEDDING_MAX_BATCH_TOKENS:-8192}
      - --auto-truncate

  # 4. TEI Reranker
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:hopper-1.9
    container_name: tei-reranker
    restart: unless-stopped
    runtime: nvidia
    shm_size: 1g
    ports:
      - "8082:80"
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/data
    command:
      - --model-id
      - ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --max-batch-tokens
      - ${RERANKER_MAX_BATCH_TOKENS:-4096}
      - --auto-truncate

  # 5. Docproc uses the same multimodal model as chat and planning.
  docproc:
    build:
      context: ../indian-alt-docproc
      dockerfile: Dockerfile
    image: india-alt-docproc:latest
    container_name: docproc
    restart: unless-stopped
    environment:
      VLLM_BASE_URL: http://vllm-text:8000/v1
      VLLM_API_KEY: ${VLLM_API_KEY:-local-dev-key}
      VLLM_TEXT_MODEL: ${VLLM_TEXT_MODEL:-google/gemma-4-12b-it}
      DOCPROC_API_KEY: ${DOCPROC_API_KEY:-local-docproc-key}
      DOCPROC_REQUEST_TIMEOUT: ${DOCPROC_REQUEST_TIMEOUT:-600}
      DOCPROC_MAX_PAGE_LIMIT: ${DOCPROC_MAX_PAGE_LIMIT:-200}
      DOCPROC_MAX_CONCURRENT_OCR: ${DOCPROC_MAX_CONCURRENT_OCR:-2}
      DOCPROC_NORMALIZATION_CHUNK_CHARS: ${DOCPROC_NORMALIZATION_CHUNK_CHARS:-12000}
    ports:
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8100
      --workers ${DOCPROC_WORKERS:-2}
      --h11-max-incomplete-event-size 524288000
      --timeout-keep-alive 600
      --timeout-graceful-shutdown 600
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
