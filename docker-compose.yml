services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-indian_alt}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-indian_alt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build: .
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-indian_alt}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_EMBEDDING_URL=${VLLM_EMBEDDING_URL:-http://host.docker.internal:8000/v1}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - VLLM_TEXT_MODEL=${VLLM_TEXT_MODEL}
      - VLLM_PLANNER_MODEL=${VLLM_PLANNER_MODEL}
      - VLLM_EMBEDDING_MODEL=${VLLM_EMBEDDING_MODEL}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://host.docker.internal:8081}
      - SEARXNG_TIMEOUT=${SEARXNG_TIMEOUT:-15}
      - SEARXNG_MAX_RESULTS=${SEARXNG_MAX_RESULTS:-30}
      - SEARXNG_SEARCH_WORKERS=${SEARXNG_SEARCH_WORKERS:-4}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-duckduckgo,bing}
      - SEARXNG_LANGUAGE=${SEARXNG_LANGUAGE:-en-IN}
      - SEARXNG_PAGE_FETCH_LIMIT=${SEARXNG_PAGE_FETCH_LIMIT:-5}
      - SEARXNG_PAGE_FETCH_WORKERS=${SEARXNG_PAGE_FETCH_WORKERS:-3}
      - SEARXNG_PAGE_FETCH_TIMEOUT=${SEARXNG_PAGE_FETCH_TIMEOUT:-8}
      - SEARXNG_PAGE_FETCH_MAX_BYTES=${SEARXNG_PAGE_FETCH_MAX_BYTES:-1000000}
      - SEARXNG_PAGE_FETCH_MAX_CHARS=${SEARXNG_PAGE_FETCH_MAX_CHARS:-2500}
      - SEARXNG_EVIDENCE_MAX_CHARS=${SEARXNG_EVIDENCE_MAX_CHARS:-18000}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - RERANKER_BASE_URL=${RERANKER_BASE_URL}
      - RERANKER_API_KEY=${RERANKER_API_KEY}
      - RERANKER_MODEL=${RERANKER_MODEL}
      - DOC_PROCESSOR_URL=${DOC_PROCESSOR_URL:-http://host.docker.internal:8100}
      - DOC_PROCESSOR_API_KEY=${DOC_PROCESSOR_API_KEY}
      - DOC_PROCESSOR_TIMEOUT=${DOC_PROCESSOR_TIMEOUT:-300}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_TEXT_MODEL=${CLAUDE_TEXT_MODEL:-claude-haiku-4-5}
      - CLAUDE_SEARCH_MODEL=${CLAUDE_SEARCH_MODEL:-claude-sonnet-4-6}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - USE_SQLITE=False
      - DB_SSL_REQUIRE=False
      # Microsoft Graph API (OneDrive + Email)
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
