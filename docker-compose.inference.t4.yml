services:
  # T4 profile: llama.cpp serves multimodal Gemma 4 because vLLM's Gemma 4 attention
  # kernel requires more shared memory than Turing provides.
  vllm-text:
    image: ${VLLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: vllm-text-t4
    restart: always
    ipc: host
    shm_size: 8g
    ports:
      - "${VLLM_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/root/.cache/huggingface
    command:
      - -hf
      - ${LLAMA_MODEL_SOURCE:-bartowski/gemma-4-12B-it-GGUF:Q8_0}
      - --alias
      - ${VLLM_TEXT_MODEL:-gemma-4-12b-it-q8}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-local-dev-key}
      - --ctx-size
      - ${LLAMA_CONTEXT_SIZE:-16384}
      - --parallel
      - ${LLAMA_PARALLEL_SEQUENCES:-1}
      - --n-gpu-layers
      - ${LLAMA_GPU_LAYERS:-99}
      - --batch-size
      - ${LLAMA_BATCH_SIZE:-2048}
      - --ubatch-size
      - ${LLAMA_UBATCH_SIZE:-512}
      - --cache-type-k
      - ${LLAMA_CACHE_TYPE_K:-q8_0}
      - --cache-type-v
      - ${LLAMA_CACHE_TYPE_V:-q8_0}
      - --log-verbosity
      - ${LLAMA_LOG_VERBOSITY:-4}
      - --log-timestamps
      - --log-prefix
      - --no-webui
      - --mmproj-auto
      - --image-max-tokens
      - ${LLAMA_IMAGE_MAX_TOKENS:-1120}

  docproc:
    build:
      context: ${DOCPROC_BUILD_CONTEXT:-./indian-alt-docproc}
      dockerfile: Dockerfile
    image: india-alt-docproc:latest
    container_name: docproc-t4
    restart: always
    depends_on:
      - vllm-text
    environment:
      VLLM_BASE_URL: http://vllm-text:8000/v1
      VLLM_API_KEY: ${VLLM_API_KEY:-local-dev-key}
      VLLM_TEXT_MODEL: ${VLLM_TEXT_MODEL:-gemma-4-12b-it-q8}
      DOCPROC_API_KEY: ${DOCPROC_API_KEY:-local-docproc-key}
      DOCPROC_REQUEST_TIMEOUT: ${DOCPROC_REQUEST_TIMEOUT:-600}
      DOCPROC_MAX_PAGE_LIMIT: ${DOCPROC_MAX_PAGE_LIMIT:-200}
      DOCPROC_MAX_CONCURRENT_OCR: ${DOCPROC_MAX_CONCURRENT_OCR:-1}
      DOCPROC_NORMALIZATION_CHUNK_CHARS: ${DOCPROC_NORMALIZATION_CHUNK_CHARS:-12000}
    ports:
      - "${DOCPROC_PORT:-8100}:8100"
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8100
      --workers ${DOCPROC_WORKERS:-1}
      --h11-max-incomplete-event-size 524288000
      --timeout-keep-alive 600
      --timeout-graceful-shutdown 600

  tei-embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:turing-1.9.3}
    container_name: tei-embedding-t4
    # TEI 1.9.3's wrapper only recognizes the standard "CUDA Version" field.
    # Azure's CUDA 13 driver reports KMD/UMD fields instead, so the wrapper
    # mistakes it for an old driver and prepends incompatible cuda-compat-12-9.
    entrypoint:
      - /usr/local/bin/text-embeddings-router
    restart: always
    shm_size: 1g
    ports:
      - "${EMBEDDING_PORT:-8081}:80"
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # CUDA 13 hosts must use the NVIDIA driver libraries injected by the
      # container runtime. TEI's bundled cuda-compat-12-9 library otherwise
      # produces CUDA_ERROR_SYSTEM_DRIVER_MISMATCH (803) and falls back to CPU.
      LD_LIBRARY_PATH: ${TEI_LD_LIBRARY_PATH:-/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64}
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --dtype
      - ${TEI_DTYPE:-float16}
      - --max-batch-tokens
      - ${EMBEDDING_MAX_BATCH_TOKENS:-2048}
      - --max-batch-requests
      - ${EMBEDDING_MAX_BATCH_REQUESTS:-1}
      - --max-client-batch-size
      - ${EMBEDDING_MAX_CLIENT_BATCH_SIZE:-8}
      - --auto-truncate
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  tei-reranker:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:turing-1.9.3}
    container_name: tei-reranker-t4
    entrypoint:
      - /usr/local/bin/text-embeddings-router
    restart: always
    shm_size: 1g
    ports:
      - "${RERANKER_PORT:-8082}:80"
    volumes:
      - ${HF_CACHE_DIR:-/mnt/vllm-cache/huggingface}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      LD_LIBRARY_PATH: ${TEI_LD_LIBRARY_PATH:-/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64}
    command:
      - --model-id
      - ${RERANKER_MODEL_ID:-BAAI/bge-reranker-base}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --dtype
      - ${TEI_DTYPE:-float16}
      - --max-batch-tokens
      - ${RERANKER_MAX_BATCH_TOKENS:-2048}
      - --auto-truncate
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
