use_default_settings:
  engines:
    # Keep the hosted test instance deliberately small. These engines either
    # returned relevant company results from Railway or use stable public APIs.
    keep_only:
      - brave
      - duckduckgo web
      - mwmbl
      - wikipedia
      - wikidata

general:
  debug: false
  instance_name: "SearXNG"
  enable_metrics: true

search:
  safe_search: 0
  default_lang: "en-IN"
  formats:
    - html
    - json
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

server:
  bind_address: "0.0.0.0"
  limiter: false
  public_instance: false
  secret_key: "change-me-via-SEARXNG_SECRET"
  image_proxy: false
  method: "GET"

valkey:
  url: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  retries: 0
  pool_connections: 50
  pool_maxsize: 20
  enable_http2: true

engines:
  # Keep the existing application engine name while using the official API.
  - name: brave
    engine: braveapi
    api_key: "__BRAVE_SEARCH_API_KEY__"
    inactive: false
    disabled: false
    timeout: 6.0
    weight: 1.5
    results_per_page: 10

  - name: duckduckgo web
    disabled: false
    weight: 1.3

  - name: mwmbl
    disabled: false
    weight: 0.8

  - name: wikipedia
    disabled: false
    weight: 0.4

  - name: wikidata
    disabled: false
    weight: 0.4
